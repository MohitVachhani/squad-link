[project]
name = "squadlink"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
build = ["pandas>=2.2"]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    { include-group = "build" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["squadlink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "data"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
